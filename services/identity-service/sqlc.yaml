version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/adapter/postgres/sqlcgen
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: "*time.Time"
          - db_type: text
            nullable: true
            go_type:
              type: "*string"
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: "*int64"
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: "*int32"
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Addr
              pointer: true
