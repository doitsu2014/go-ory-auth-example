# Local static host for the admin console (compose profile "app").
# Mirrors apps/admin-web/public/_headers with the local origins.
# All add_header lines live at server level: a location with its own
# add_header would silently drop them.
map $uri $admin_cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:4433 http://localhost:8080; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self' http://localhost:4433" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cache-Control $admin_cache_control always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
  }

  # SPA fallback (same as public/_redirects).
  location / {
    try_files $uri /index.html;
  }
}
