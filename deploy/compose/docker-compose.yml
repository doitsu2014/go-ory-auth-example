# Local development stack (docs/architecture/05-deployment.md §5.1).
# Admin / internal ports are bound to 127.0.0.1 only (HC-02).
name: go-ory-auth-example

x-kratos-env: &kratos-env
  DSN: postgres://kratos:${KRATOS_DB_PASSWORD}@postgres:5432/kratos?sslmode=disable&max_conns=10
  SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE_VALUE}
  SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER_VALUE}
  SECRETS_DEFAULT: ${KRATOS_SECRETS_DEFAULT_VALUE}

services:
  postgres:
    image: postgres:16-alpine
    networks: [default, hydra-db]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/compose/.env}
      KRATOS_DB_PASSWORD: ${KRATOS_DB_PASSWORD:?}
      KETO_DB_PASSWORD: ${KETO_DB_PASSWORD:?}
      IDENTITY_MIGRATOR_DB_PASSWORD: ${IDENTITY_MIGRATOR_DB_PASSWORD:?}
      IDENTITY_APP_DB_PASSWORD: ${IDENTITY_APP_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # Renders kratos.yml from the template, injecting the webhook key (Kratos
  # does not expand ${VAR} in YAML).
  kratos-config:
    image: alpine:3.22
    environment:
      KRATOS_WEBHOOK_API_KEY: ${KRATOS_WEBHOOK_API_KEY:?}
      KRATOS_COURIER_API_KEY: ${KRATOS_COURIER_API_KEY:?}
      IDENTITY_WEBHOOK_BASE_URL: ${IDENTITY_WEBHOOK_BASE_URL:-http://identity-service:8081}
    command:
      - sh
      - -c
      - >
        test -n "$$KRATOS_WEBHOOK_API_KEY" && test -n "$$KRATOS_COURIER_API_KEY" &&
        sed -e "s|__KRATOS_WEBHOOK_API_KEY__|$$KRATOS_WEBHOOK_API_KEY|g"
        -e "s|__KRATOS_COURIER_API_KEY__|$$KRATOS_COURIER_API_KEY|g"
        -e "s|__IDENTITY_WEBHOOK_BASE_URL__|$$IDENTITY_WEBHOOK_BASE_URL|g"
        /tmpl/kratos.yml.tmpl > /rendered/kratos.yml
    volumes:
      - ../ory/kratos/kratos.yml.tmpl:/tmpl/kratos.yml.tmpl:ro
      - kratos-config:/rendered

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    environment: *kratos-env
    command: migrate sql -e --yes
    depends_on:
      postgres:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v26.2.0
    environment: *kratos-env
    command: serve --config /etc/config/kratos/rendered/kratos.yml --dev --watch-courier
    ports:
      - "4433:4433"
      - "127.0.0.1:4434:4434"
    volumes:
      - kratos-config:/etc/config/kratos/rendered:ro
      - ../ory/kratos/identity-schemas:/etc/config/kratos/identity-schemas:ro
      - ../ory/kratos/webhooks:/etc/config/kratos/webhooks:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kratos-config:
        condition: service_completed_successfully
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4434/admin/health/ready >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  keto-migrate:
    image: oryd/keto:v26.2.0
    environment:
      DSN: postgres://keto:${KETO_DB_PASSWORD}@postgres:5432/keto?sslmode=disable&max_conns=10
    command: migrate up --yes --config /etc/config/keto/keto.yml
    volumes:
      - ../ory/keto:/etc/config/keto:ro
    depends_on:
      postgres:
        condition: service_healthy

  keto:
    image: oryd/keto:v26.2.0
    environment:
      DSN: postgres://keto:${KETO_DB_PASSWORD}@postgres:5432/keto?sslmode=disable&max_conns=10
    command: serve --config /etc/config/keto/keto.yml
    ports:
      - "127.0.0.1:4466:4466"
      - "127.0.0.1:4467:4467"
    volumes:
      - ../ory/keto:/etc/config/keto:ro
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4466/health/ready >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Ory Hydra: OAuth2 server for machine-to-machine access (ADR-0012).
  hydra-db:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/provision/hydra.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      HYDRA_DB_PASSWORD: ${HYDRA_DB_PASSWORD:?}
    volumes:
      - ../postgres/provision/hydra.sh:/provision/hydra.sh:ro
    networks: [hydra-db]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    command: ["migrate", "sql", "up", "-e", "--yes", "--config", "/etc/config/hydra/hydra.yml"]
    environment: &hydra-env
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD:?}@postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:?}
    volumes:
      - ../ory/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    networks: [hydra-db]
    restart: "no"
    depends_on:
      hydra-db:
        condition: service_completed_successfully

  hydra:
    image: oryd/hydra:v26.2.0
    # --dev allows plain HTTP locally (like Kratos); never in production.
    command: ["serve", "all", "--dev", "--config", "/etc/config/hydra/hydra.yml"]
    environment: *hydra-env
    volumes:
      - ../ory/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    # Not on `default`: only identity-service (network `hydra`) can reach the
    # unauthenticated admin API; Postgres is reached via `hydra-db`.
    networks: [hydra, hydra-db]
    ports:
      - "4444:4444"
      - "127.0.0.1:4445:4445"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4445/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  # Key manager for PII envelope encryption (KEK + blind-index key in Transit).
  openbao:
    image: openbao/openbao:2.4.1
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    volumes:
      - ../openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/file
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      # exit 0 = unsealed, 2 = sealed (still reachable), 1 = error
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1; [ $$? -ne 1 ]"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Initialise/unseal OpenBao, configure Transit keys + policies, issue the
  # identity-service token. Idempotent; re-runs on every `up`.
  openbao-init:
    image: openbao/openbao:2.4.1
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ../openbao/init.sh:/init.sh:ro
      - ../openbao/policies:/policies:ro
      - openbao-keys:/bao-keys
      - openbao-app-token:/bao-app
    restart: "no"
    depends_on:
      openbao:
        condition: service_healthy

  # One-shot schema migration with the owner role (identity_migrator). The
  # long-running service only ever gets the DML-only identity_app DSN.
  identity-migrate:
    profiles: ["app"]
    image: go-ory-auth-example/identity-service:local
    build:
      context: ../../services/identity-service
    command: ["migrate", "up"]
    environment:
      MIGRATE_DATABASE_URL: postgres://identity_migrator:${IDENTITY_MIGRATOR_DB_PASSWORD}@postgres:5432/identity?sslmode=disable&application_name=identity-service-migrate
      LOG_LEVEL: info
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  identity-service:
    profiles: ["app"]
    image: go-ory-auth-example/identity-service:local
    networks: [default, hydra]
    build:
      context: ../../services/identity-service
    environment:
      HTTP_ADDR: ":8080"
      WEBHOOK_ADDR: ":8081"
      OPS_ADDR: ":9090"
      DATABASE_URL: postgres://identity_app:${IDENTITY_APP_DB_PASSWORD}@postgres:5432/identity?sslmode=disable&application_name=identity-service
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      KETO_READ_URL: http://keto:4466
      KETO_WRITE_URL: http://keto:4467
      KRATOS_WEBHOOK_API_KEY: ${KRATOS_WEBHOOK_API_KEY:?}
      # Pseudonymous login identifiers (ADR-0013).
      KRATOS_COURIER_API_KEY: ${KRATOS_COURIER_API_KEY:?}
      COURIER_DEDUPE_SECRET: ${COURIER_DEDUPE_SECRET:?}
      LOGIN_MIGRATION_PHASE: ${LOGIN_MIGRATION_PHASE:-transition}
      SMS_PROVIDER: sink
      # Local only: seeding and the smoke test register many customers from
      # one host address; production keeps the defaults (5/1m, 30/24h).
      LOGIN_REGISTER_RATE: 60/1m,1000/24h
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SMTP_URL: smtp://mailpit:1025
      SMTP_FROM: no-reply@go-ory-auth-example.local
      ADMIN_WEB_URL: http://localhost:5173
      LOG_LEVEL: info
      # Local stack: allows the plain-http OpenBao address below (APP_ENV
      # defaults to production, which requires https).
      APP_ENV: local
      PII_KMS_PROVIDER: openbao
      PII_OPENBAO_ADDR: http://openbao:8200
      PII_OPENBAO_TOKEN_FILE: /run/openbao/identity-service.token
      HYDRA_ADMIN_URL: http://hydra:4445
      M2M_JWKS_URL: http://hydra:4444/.well-known/jwks.json
      M2M_ISSUER: http://localhost:4444
      M2M_AUDIENCE: identity-service
      M2M_CLIENT_TAG_KEY: ${M2M_CLIENT_TAG_KEY:?}
    volumes:
      - openbao-app-token:/run/openbao:ro
    healthcheck:
      test: ["CMD", "/identity-service", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kratos:
        condition: service_healthy
      keto:
        condition: service_healthy
      hydra:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully

  admin-web:
    profiles: ["app"]
    image: go-ory-auth-example/admin-web:local
    build:
      context: ../../apps/admin-web
      args:
        VITE_KRATOS_PUBLIC_URL: http://localhost:4433
        VITE_API_URL: http://localhost:8080
        VITE_HYDRA_PUBLIC_URL: http://localhost:4444
    volumes:
      - ../admin-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Kratos ui_urls and CORS expect exactly http://localhost:5173.
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      identity-service:
        condition: service_healthy

networks:
  default:
  # identity-service <-> Hydra only (admin API has no authentication).
  hydra:
  # Hydra <-> Postgres only.
  hydra-db:

volumes:
  pgdata:
  kratos-config:
  openbao-data:
  openbao-keys:
  openbao-app-token:
