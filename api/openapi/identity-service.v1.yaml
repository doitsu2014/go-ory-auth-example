openapi: 3.0.3
info:
  title: identity-service API
  version: 1.0.0
  description: |
    Contract for the go-ory-auth-example identity-service (ADR-0010).
    Human-readable guide: docs/api/identity-service-api.md.

    Credential is bound to plane:
    - `POST /v1/auth/{login,registration,recovery}` take no credential (public, rate limited per client IP).
    - `/v1/*` accepts only `Authorization: Bearer <kratos session token>` (mobile).
    - `/admin/v1/*` accepts only the Kratos session cookie (admin web).
    - `/m2m/v1/*` accepts only an Ory Hydra client_credentials JWT (service clients).

    Errors use RFC 9457 Problem Details (`application/problem+json`) with a stable `code`.
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: auth
  - name: me
  - name: admin
  - name: customers
  - name: admins
  - name: audit
  - name: hooks
  - name: machine
  - name: service-clients

paths:
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: customerLogin
      summary: Sign a customer in with email or phone number and password
      description: |
        ADR-0014. identity-service normalises the address, finds its opaque
        Kratos handle through the keyed lookup hash and runs a Kratos native
        (API) login flow on the customer's behalf. The handle never leaves the
        server. Unknown addresses run the same flow with a random decoy
        handle, so the answer is identical: 400 `auth_flow_rejected` with
        `errors[{field: "form", code: "4000006"}]`.

        Rejections carry Kratos message ids only (`field` is `login`,
        `password` or `form`); never the flow. The password is never logged
        or stored. Rate limited per client IP (IPv6 per /64) 20/min and
        200/day, per /24 (/48) network, and per account for failed attempts
        (10/15 min, 50/day) → 429 `rate_limited`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCredentials" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthSession" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/auth/registration:
    post:
      tags: [auth]
      operationId: customerRegistration
      summary: Register a customer with email or phone number and password
      description: |
        ADR-0014. Stores the address encrypted under a new random handle (or
        re-uses the handle of an earlier, unfinished registration of the same
        address) and runs a Kratos native registration flow with
        `traits.login_id = <handle>`. Kratos sends the verification code; the
        app submits it to Kratos directly with `verification_flow_id`.
        Password policy and duplicate errors come back as 400
        `auth_flow_rejected` (e.g. `password`/`4000032`, `login`/`4000007`).
        Rate limited per client IP 5/min and 30/day, and per network.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCredentials" }
      responses:
        "200":
          description: Registered and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthSession" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/auth/recovery:
    post:
      tags: [auth]
      operationId: customerRecovery
      summary: Start password recovery by code for an email or phone number
      description: |
        ADR-0014. Starts a Kratos native recovery flow (method `code`) for the
        address's handle — or a random decoy handle when there is no account,
        so the response has the same shape every time. A code is delivered
        (email or SMS) only when the account exists.

        The response carries `recovery_id`, the flow id sealed by
        identity-service: never the Kratos flow id, because anyone can read a
        Kratos recovery flow by id and it shows the handle. The app submits
        the code with `POST /v1/auth/recovery/code`, then sets the new
        password in the returned settings flow at Kratos directly. Same rate
        limits as login (per IP and network).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRecoveryRequest" }
      responses:
        "200":
          description: Recovery flow started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRecoveryStarted" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/auth/recovery/code:
    post:
      tags: [auth]
      operationId: customerRecoveryCode
      summary: Submit a recovery code
      description: |
        ADR-0014. Submits the 6-digit code on the recovery flow behind
        `recovery_id`. A valid code returns Kratos's privileged session token
        and the settings flow to set the new password in (directly at
        Kratos, `X-Session-Token`). A wrong code is 400 `auth_flow_rejected`
        (`form`/`4060006`); an expired flow 410 `auth_flow_expired` (start
        again with `POST /v1/auth/recovery`). Same rate limits as login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRecoveryCodeRequest" }
      responses:
        "200":
          description: Code accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRecoveryGrant" }
        "400": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current customer profile
      security: [{ bearerSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update the current customer's profile (requires verified email)
      security: [{ bearerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/me/personal-info:
    get:
      tags: [me]
      operationId: getMyPersonalInfo
      summary: Read the caller's decrypted personal information
      description: |
        Values are decrypted in memory for this response only. Fields never set
        are `null`. 503 `dependency_unavailable` when the key manager is down.
      security: [{ bearerSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalInfo" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      tags: [me]
      operationId: putMyPersonalInfo
      summary: Replace the caller's personal information (verified email required)
      description: |
        Full replacement: omitted or `null` fields are cleared. Validation errors
        name the field and code only; submitted values are never echoed.
      security: [{ bearerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalInfo" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalInfo" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [me]
      operationId: eraseMyPersonalInfo
      summary: Erase the caller's personal information (crypto-shredding; any authenticated customer)
      description: Destroys the caller's data key and deletes the encrypted record. Idempotent.
      security: [{ bearerSession: [] }]
      responses:
        "204": { description: Erased }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/v1/me:
    get:
      tags: [admin]
      operationId: getAdminMe
      summary: Current admin session; the only admin endpoint reachable at AAL1
      description: |
        403 codes drive the admin web routing: `not_admin`, `aal2_required`,
        `mfa_enrollment_required`.
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMe" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: List customers (permission view_customers)
      security: [{ cookieSession: [] }]
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/IdentityState" } }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/v1/customers/lookup:
    post:
      tags: [customers]
      operationId: lookupCustomers
      summary: Find customers by personal-info phone number or by login identifier (permission view_customers)
      description: |
        Exactly one of `phone_number` (self-declared personal-info phone, blind
        index) or `login` (email or phone the customer signs in with; exact
        match) must be set. Values travel in the body so they never appear in
        URLs or access logs. A `login` lookup is charged one unit and audited as
        `customer.login.lookup` (kind and matched ids only).
        Rate limited per actor (30/min, 200/day → 429 `rate_limited`), charged per candidate
        examined (minimum 1 per call); every call is audited. Phone numbers are self-declared
        (phone_verified: false): several customers may claim the same number, at most 20
        candidates are examined and `truncated` reports more.
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerLookupRequest" }
      responses:
        "200":
          description: Matches (possibly empty)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerLookupResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/v1/customers/{id}/personal-info:
    parameters: [{ $ref: "#/components/parameters/IdentityId" }]
    get:
      tags: [customers]
      operationId: getCustomerPersonalInfoMasked
      summary: Masked personal information (permission view_customers)
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaskedPersonalInfo" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/v1/customers/{id}/personal-info/reveal:
    parameters: [{ $ref: "#/components/parameters/IdentityId" }]
    post:
      tags: [customers]
      operationId: revealCustomerPersonalInfo
      summary: Reveal full personal information with a reason (permission reveal_customer_pii; audited)
      description: |
        Order: decrypt in memory → commit audit event `customer.pii.revealed`
        (actor, target, fields, reason_code, ticket_ref) → respond. If the audit
        row cannot be written, buffers are zeroed and nothing is revealed (500).
        Rate limited per actor (20/hour → 429 `rate_limited`).
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevealRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevealedPersonalInfo" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/v1/customers/{id}:
    parameters: [{ $ref: "#/components/parameters/IdentityId" }]
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Get one customer (permission view_customers)
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/v1/customers/{id}/disable:
    parameters: [{ $ref: "#/components/parameters/IdentityId" }]
    post:
      tags: [customers]
      operationId: disableCustomer
      summary: Disable a customer and revoke all sessions (permission manage_customers; idempotent)
      security: [{ cookieSession: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerState" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/v1/customers/{id}/enable:
    parameters: [{ $ref: "#/components/parameters/IdentityId" }]
    post:
      tags: [customers]
      operationId: enableCustomer
      summary: Re-enable a customer (permission manage_customers; idempotent)
      security: [{ cookieSession: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerState" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/v1/customers/{id}/sessions:
    parameters: [{ $ref: "#/components/parameters/IdentityId" }]
    delete:
      tags: [customers]
      operationId: revokeCustomerSessions
      summary: Revoke all sessions of a customer (permission manage_customers)
      security: [{ cookieSession: [] }]
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/v1/admins:
    get:
      tags: [admins]
      operationId: listAdmins
      summary: List admins (permission manage_admins)
      security: [{ cookieSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [admins]
      operationId: inviteAdmin
      summary: Invite an admin (permission manage_admins). The invitation link is emailed, never returned.
      security: [{ cookieSession: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteAdminRequest" }
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitedAdmin" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/v1/admins/{id}/role:
    parameters: [{ $ref: "#/components/parameters/IdentityId" }]
    put:
      tags: [admins]
      operationId: changeAdminRole
      summary: Change an admin's role (permission manage_admins; not self; keeps >= 1 super_admin)
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRoleRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admin" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/v1/audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: List audit events, newest first (permission view_audit)
      security: [{ cookieSession: [] }]
      parameters:
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /m2m/v1/customers/{id}:
    parameters: [{ $ref: "#/components/parameters/IdentityId" }]
    get:
      tags: [machine]
      operationId: getMachineCustomer
      summary: Customer status for service clients (scope customers:read); no personal data
      security: [{ machineToken: [customers:read] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineCustomer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /m2m/v1/audit-events:
    get:
      tags: [machine]
      operationId: listMachineAuditEvents
      summary: List audit events, newest first (scope audit:read)
      description: |
        Filtered view: only allowlisted actions (customer state changes, admin.*,
        service_client.*) and allowlisted detail keys. Personal-data actions
        (`customer.pii.*`) are never exposed to machines.
      security: [{ machineToken: [audit:read] }]
      parameters:
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineAuditEventPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/v1/service-clients:
    get:
      tags: [service-clients]
      operationId: listServiceClients
      summary: List machine clients managed by identity-service (permission manage_service_clients)
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceClientList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      tags: [service-clients]
      operationId: createServiceClient
      summary: Register a client_credentials client (permission manage_service_clients; secret returned once)
      description: |
        The secret is in this response only and is never stored by identity-service.
        A replay with the same Idempotency-Key returns the client without `client_secret`;
        use rotate-secret if it was lost.
      security: [{ cookieSession: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServiceClientRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceClientWithSecret" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/v1/service-clients/{client_id}:
    parameters: [{ $ref: "#/components/parameters/ClientId" }]
    get:
      tags: [service-clients]
      operationId: getServiceClient
      summary: Get one machine client (permission manage_service_clients)
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceClient" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [service-clients]
      operationId: deleteServiceClient
      summary: Delete a machine client; its tokens stop working within 30 s (permission manage_service_clients)
      security: [{ cookieSession: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/v1/service-clients/{client_id}/rotate-secret:
    parameters: [{ $ref: "#/components/parameters/ClientId" }]
    post:
      tags: [service-clients]
      operationId: rotateServiceClientSecret
      summary: Replace the client secret; the old one stops working immediately (permission manage_service_clients)
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: New secret (shown once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceClientWithSecret" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # Served on the webhook port (:8081) only; listed for completeness.
  /internal/hooks/kratos/after-registration:
    post:
      tags: [hooks]
      operationId: kratosAfterRegistration
      summary: Kratos after-registration webhook (profile provisioning)
      security: [{ webhookKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KratosHookPayload" }
      responses:
        "204": { description: Processed (idempotent) }
        "401": { description: Bad key }

  /internal/hooks/kratos/pre-registration:
    post:
      tags: [hooks]
      operationId: kratosPreRegistration
      summary: Kratos pre-persist registration check (response.parse true)
      description: |
        ADR-0013 / PLI-FR-04. Rejects a registration whose `login_id` is not a
        handle stored by identity-service (ADR-0014), a legacy `email` trait, or
        (during the migration) an address a legacy customer already uses. 200
        allows; 400 carries Kratos-formatted messages on `#/traits/login_id`
        (ids 4049001 legacy traits, 4049002 unresolved, 4000007 duplicate).
      security: [{ webhookKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KratosPreRegistrationPayload" }
      responses:
        "200": { description: Allowed }
        "400": { description: Rejected (Kratos webhook message format) }
        "401": { description: Bad key }
        "503": { description: Dependency unavailable (registration fails, nothing persisted) }

  /internal/hooks/kratos/courier:
    post:
      tags: [hooks]
      operationId: kratosCourier
      summary: Kratos courier http delivery (verification / recovery codes)
      description: |
        ADR-0013 / PLI-FR-05. Kratos `courier.delivery_strategy: http`. The
        recipient is a pseudonym (customers) or an admin's email; the service
        resolves it and sends its own localised message by email or SMS.
        Authenticated with the courier key (not the webhook key). 204 = sent,
        duplicate or permanently dropped (no retry); 503 = transient (Kratos
        retries).
      security: [{ courierKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KratosCourierPayload" }
      responses:
        "204": { description: Handled }
        "401": { description: Bad key }
        "503": { description: Transient failure, Kratos retries }

  /internal/hooks/kratos/after-login:
    post:
      tags: [hooks]
      operationId: kratosAfterLogin
      summary: Kratos after-login population guard
      description: |
        Interrupting population guard (ADR-0004). Returns 204 to allow, or 403
        with a Kratos-formatted message body to interrupt the login.
      security: [{ webhookKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KratosHookPayload" }
      responses:
        "204": { description: Allowed }
        "401": { description: Bad key }
        "403": { description: Login interrupted (Kratos webhook message format) }

components:
  securitySchemes:
    machineToken:
      type: oauth2
      description: |
        Ory Hydra client_credentials JWT (RS256), audience `identity-service`.
        Accepted only on `/m2m/v1/*`. Token endpoint is Hydra's, not this service's.
      flows:
        clientCredentials:
          tokenUrl: http://localhost:4444/oauth2/token
          scopes:
            customers:read: Read customer status (no personal data)
            audit:read: Read audit events
    bearerSession:
      type: http
      scheme: bearer
      description: Kratos session token from a native (API) flow.
    cookieSession:
      type: apiKey
      in: cookie
      name: ory_kratos_session
    webhookKey:
      type: apiKey
      in: header
      name: Authorization
    courierKey:
      type: apiKey
      in: header
      name: Authorization
      description: Kratos courier key (KRATOS_COURIER_API_KEY), distinct from the webhook key.

  parameters:
    ClientId:
      name: client_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    IdentityId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PageToken:
      name: page_token
      in: query
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: "https://docs.go-ory-auth-example.local/problems/aal2-required" }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: |
            Stable machine code. Known values: unauthenticated, forbidden, not_admin,
            aal2_required, mfa_enrollment_required, email_not_verified, not_found,
            conflict, validation_failed, rate_limited, dependency_unavailable, internal,
            invalid_request, invalid_token, insufficient_scope (machine plane; also sent in `WWW-Authenticate`),
            auth_flow_rejected (400, /v1/auth/*: Kratos rejected the flow; `errors[].code` is the Kratos message id,
            `errors[].field` is login, password or form), auth_flow_expired (410, /v1/auth/recovery/code: start again).
            Clients must tolerate unknown values.
        detail: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string, example: too_long }

    PersonName:
      type: object
      properties:
        first: { type: string, maxLength: 100 }
        last: { type: string, maxLength: 100 }

    IdentityState:
      type: string
      enum: [active, inactive]

    Role:
      type: string
      enum: [support, admin, super_admin]

    Permission:
      type: string
      enum: [view_customers, manage_customers, manage_admins, view_audit, reveal_customer_pii, manage_service_clients]

    Me:
      type: object
      required: [id, login, email_verified, locale, created_at]
      properties:
        id: { type: string, format: uuid }
        login: { $ref: "#/components/schemas/LoginIdentifier" }
        email:
          type: string
          format: email
          deprecated: true
          description: Present only when login.type is email. Use `login`.
        email_verified: { type: boolean, description: "The login identifier (email or phone) is verified; the name is kept for compatibility" }
        name:
          allOf: [{ $ref: "#/components/schemas/PersonName" }]
          type: object
          deprecated: true
          description: Never returned. The customer's name is encrypted personal info (GET /v1/me/personal-info).
        display_name: { type: string, nullable: true, maxLength: 100, description: "Optional nickname; not the real name" }
        avatar_url: { type: string, nullable: true, maxLength: 2048 }
        locale: { type: string, example: vi-VN }
        created_at: { type: string, format: date-time }

    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, nullable: true, maxLength: 100 }
        avatar_url: { type: string, nullable: true, maxLength: 2048 }
        locale: { type: string, maxLength: 35 }

    Address:
      type: object
      additionalProperties: false
      required: [line1, city, country]
      properties:
        line1: { type: string, minLength: 1, maxLength: 200 }
        line2: { type: string, nullable: true, maxLength: 200 }
        city: { type: string, minLength: 1, maxLength: 100 }
        region: { type: string, nullable: true, maxLength: 100 }
        postal_code: { type: string, nullable: true, maxLength: 20 }
        country: { type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2 }

    NationalId:
      type: object
      additionalProperties: false
      required: [type, number]
      properties:
        type: { type: string, enum: [cccd, passport, other] }
        number: { type: string, minLength: 6, maxLength: 20, description: "Upper-cased, ^[A-Z0-9]{6,20}$" }

    PersonalInfo:
      type: object
      additionalProperties: false
      description: Customer PII. Stored encrypted (AES-256-GCM, per-customer key).
      properties:
        name:
          allOf: [{ $ref: "#/components/schemas/PersonName" }]
          type: object
          nullable: true
          description: "Real name. Each part trimmed, no control characters; both parts empty = absent"
        phone_number: { type: string, nullable: true, example: "+84901234567", description: "E.164; spaces, dashes and dots are stripped" }
        date_of_birth: { type: string, format: date, nullable: true }
        address:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          type: object
          nullable: true
        national_id:
          allOf: [{ $ref: "#/components/schemas/NationalId" }]
          type: object
          nullable: true
        updated_at: { type: string, format: date-time, nullable: true, readOnly: true }

    RevealedPersonalInfo:
      type: object
      description: Reveal response. Personal info fields (as PersonalInfo) plus the login identifier.
      properties:
        name:
          allOf: [{ $ref: "#/components/schemas/PersonName" }]
          type: object
          nullable: true
        phone_number: { type: string, nullable: true }
        date_of_birth: { type: string, format: date, nullable: true }
        address:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          type: object
          nullable: true
        national_id:
          allOf: [{ $ref: "#/components/schemas/NationalId" }]
          type: object
          nullable: true
        updated_at: { type: string, format: date-time, nullable: true }
        login:
          allOf: [{ $ref: "#/components/schemas/LoginIdentifier" }]
          type: object
          nullable: true

    LoginType:
      type: string
      enum: [email, phone]

    LoginIdentifier:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { $ref: "#/components/schemas/LoginType" }
        value: { type: string, maxLength: 320, description: "Email (lower-cased) or phone (E.164) in responses; as typed in requests" }

    MaskedLogin:
      type: object
      required: [type, masked]
      properties:
        type: { $ref: "#/components/schemas/LoginType" }
        masked: { type: string, example: "a***@e***.com", description: "Email: first character of local part and domain label + TLD; phone: calling code + 7 stars + last 3" }

    CustomerCredentials:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: { $ref: "#/components/schemas/LoginIdentifier" }
        password: { type: string, minLength: 1, maxLength: 1024, format: password }

    CustomerRecoveryRequest:
      type: object
      additionalProperties: false
      required: [login]
      properties:
        login: { $ref: "#/components/schemas/LoginIdentifier" }

    CustomerAuthSession:
      type: object
      required: [session_token, session]
      properties:
        session_token: { type: string, description: "Kratos session token (store in secure storage; send as Bearer to /v1 and X-Session-Token to Kratos)" }
        session:
          type: object
          additionalProperties: true
          description: The Kratos session object, as returned by Kratos to its owner
          x-go-type: json.RawMessage
        verification_flow_id:
          type: string
          format: uuid
          description: Registration only, when Kratos started a verification flow (code already sent)

    CustomerRecoveryStarted:
      type: object
      required: [recovery_id]
      properties:
        recovery_id: { type: string, maxLength: 1024, description: "Opaque reference to the recovery flow (sealed by identity-service); send it back with the code" }

    CustomerRecoveryCodeRequest:
      type: object
      additionalProperties: false
      required: [recovery_id, code]
      properties:
        recovery_id: { type: string, minLength: 1, maxLength: 1024 }
        code: { type: string, pattern: "^[0-9]{6}$" }

    CustomerRecoveryGrant:
      type: object
      required: [session_token, settings_flow_id]
      properties:
        session_token: { type: string, description: "Privileged Kratos session token (store it only after the new password is set)" }
        settings_flow_id: { type: string, description: Kratos native settings flow for the new password }

    MaskedPersonalInfo:
      type: object
      required: [has_name, has_phone_number, has_date_of_birth, has_address, has_national_id]
      properties:
        name:
          type: object
          nullable: true
          description: First character of each part + fixed "***"
          properties:
            first: { type: string, nullable: true, example: "A***" }
            last: { type: string, nullable: true, example: "N***" }
        phone_number: { type: string, nullable: true, example: "+84*******567", description: "Calling code + fixed 7 stars + last 3" }
        date_of_birth: { type: string, nullable: true, example: "1990-**-**" }
        address:
          type: object
          nullable: true
          properties:
            city: { type: string }
            country: { type: string }
        national_id:
          type: object
          nullable: true
          properties:
            type: { type: string, enum: [cccd, passport, other] }
            number: { type: string, example: "******123", description: "Fixed 6 stars; last 3 only when the number has ≥ 9 characters" }
        has_name: { type: boolean }
        has_phone_number: { type: boolean }
        has_date_of_birth: { type: boolean }
        has_address: { type: boolean }
        has_national_id: { type: boolean }
        updated_at: { type: string, format: date-time, nullable: true }

    RevealRequest:
      type: object
      additionalProperties: false
      required: [reason_code]
      description: Free-text reasons are not accepted because the audit log is append-only and must never hold PII.
      properties:
        reason_code:
          type: string
          enum: [customer_support_request, identity_verification, fraud_investigation, legal_request]
        ticket_ref: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}-[0-9]{1,8}$", example: "SUP-1234" }
        fields:
          type: array
          description: Fields to reveal (data minimisation). Omitted = all.
          uniqueItems: true
          minItems: 1
          items: { type: string, enum: [name, phone_number, date_of_birth, address, national_id, login] }

    CustomerLookupRequest:
      type: object
      additionalProperties: false
      description: Exactly one of phone_number or login (else 422 validation_failed, field body, code one_of).
      properties:
        phone_number: { type: string, example: "+84901234567" }
        login: { $ref: "#/components/schemas/LoginIdentifier" }

    CustomerLookupResult:
      type: object
      required: [items, truncated]
      description: Matches by self-declared phone number (phone_verified false); not proof of ownership.
      properties:
        truncated:
          type: boolean
          description: More than 20 records carry this phone number; only the first 20 were examined.
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, personal_info]
            properties:
              id: { type: string, format: uuid }
              state: { $ref: "#/components/schemas/IdentityState" }
              personal_info: { $ref: "#/components/schemas/MaskedPersonalInfo" }
              login: { $ref: "#/components/schemas/MaskedLogin" }

    MachineScope:
      type: string
      enum: ["customers:read", "audit:read"]

    MachineCustomer:
      type: object
      required: [id, state, email_verified, created_at]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/IdentityState" }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }

    MachineAuditEvent:
      type: object
      required: [id, occurred_at, actor_id, action, target_type, target_id]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        details:
          type: object
          description: Allowlisted keys only (role, previous_role, scopes, name).
          additionalProperties: false
          properties:
            role: { type: string }
            previous_role: { type: string }
            scopes: { type: array, items: { type: string } }
            name: { type: string }

    MachineAuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MachineAuditEvent" }
        next_page_token: { type: string, nullable: true }

    CreateServiceClientRequest:
      type: object
      additionalProperties: false
      required: [name, owner, scopes]
      properties:
        name: { type: string, minLength: 3, maxLength: 64, pattern: "^[a-z0-9][a-z0-9-]*$", example: billing-sync }
        owner: { type: string, format: email, maxLength: 254, description: Contact responsible for the client }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/MachineScope" }

    ServiceClient:
      type: object
      required: [client_id, name, owner, scopes, created_at]
      properties:
        client_id: { type: string }
        name: { type: string }
        owner: { type: string, format: email }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/MachineScope" }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }

    ServiceClientWithSecret:
      allOf:
        - { $ref: "#/components/schemas/ServiceClient" }
        - type: object
          properties:
            client_secret:
              type: string
              description: Present only on create and rotate. Never stored by identity-service.

    ServiceClientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ServiceClient" }

    AdminMe:
      type: object
      required: [id, email, aal, roles, permissions, session_expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { $ref: "#/components/schemas/PersonName" }
        aal: { type: string, enum: [aal1, aal2] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        session_expires_at: { type: string, format: date-time }

    Customer:
      type: object
      required: [id, email_verified, login_unavailable, state, created_at]
      properties:
        id: { type: string, format: uuid }
        email:
          type: string
          format: email
          deprecated: true
          description: Never returned for customers (ADR-0013). Use `login`.
        login:
          allOf: [{ $ref: "#/components/schemas/MaskedLogin" }]
          type: object
          nullable: true
          description: Masked login identifier; null when it could not be read
        login_unavailable: { type: boolean, description: "The key manager was unavailable; `login` is null for pseudonymous customers" }
        email_verified: { type: boolean, description: "The login identifier is verified" }
        name:
          allOf: [{ $ref: "#/components/schemas/PersonName" }]
          type: object
          deprecated: true
          description: Never returned for customers. The name is encrypted personal info (masked via /admin/v1/customers/{id}/personal-info).
        state: { $ref: "#/components/schemas/IdentityState" }
        display_name: { type: string, nullable: true, description: "Optional nickname; not the real name" }
        created_at: { type: string, format: date-time }

    CustomerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        next_page_token: { type: string }

    CustomerState:
      type: object
      required: [id, state]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/IdentityState" }

    ReasonRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

    Admin:
      type: object
      required: [id, email, role, state, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { $ref: "#/components/schemas/PersonName" }
        role: { $ref: "#/components/schemas/Role" }
        state: { $ref: "#/components/schemas/IdentityState" }
        mfa_enrolled: { type: boolean }
        created_at: { type: string, format: date-time }

    AdminPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Admin" }
        next_page_token: { type: string }

    InviteAdminRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        name: { $ref: "#/components/schemas/PersonName" }
        role: { $ref: "#/components/schemas/Role" }

    InvitedAdmin:
      type: object
      required: [id, email, role, invitation_expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        invitation_expires_at: { type: string, format: date-time }

    ChangeRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/Role" }

    AuditEvent:
      type: object
      required: [id, occurred_at, actor_id, action, target_type, target_id, request_id, details]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        action: { type: string, example: customer.disabled }
        target_type: { type: string, example: customer }
        target_id: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }

    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_page_token: { type: string }

    KratosHookPayload:
      type: object
      required: [identity_id, schema_id, flow_type]
      properties:
        identity_id: { type: string, format: uuid }
        schema_id: { type: string }
        flow_type: { type: string, enum: [api, browser] }
        login_id: { type: string, description: "after-registration only: the customer's pseudonymous login_id (binds the vault entry)" }

    KratosPreRegistrationPayload:
      type: object
      required: [schema_id]
      properties:
        schema_id: { type: string }
        flow_type: { type: string }
        login_id: { type: string, nullable: true }
        email: { type: string, nullable: true, description: "legacy trait; always rejected" }

    KratosCourierPayload:
      type: object
      required: [recipient, template_type]
      properties:
        recipient: { type: string, maxLength: 320 }
        template_type: { type: string }
        identity_id: { type: string, format: uuid, nullable: true }
        code: { type: string, nullable: true, pattern: "^[0-9]{6}$" }
        expires_in_minutes: { type: integer, nullable: true }
