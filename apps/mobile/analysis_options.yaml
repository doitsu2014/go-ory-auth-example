include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/gen/**

linter:
  rules:
    # App code, not a published package.
    public_member_api_docs: false
    # Riverpod / widget code reads better with local type inference.
    omit_local_variable_types: false
    # Dev-SDK lint pushing the experimental `new` constructor syntax.
    unnecessary_type_name_in_constructor: false
    # Private named parameters are not available on stable Dart yet.
    prefer_initializing_formals: false
    # Suggests the dev-only `class C;` syntax; keep `{}` for stable Dart.
    empty_container_bodies: false
